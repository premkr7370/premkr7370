<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Prem Kumar - Full Stack Developer | Agentic AI Explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#140a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b86bff"/>
      <stop offset="0.55" stop-color="#4d8dff"/>
      <stop offset="1" stop-color="#22e4ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6d5bff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,monospace; }
    .sans { font-family: 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .code { font-size: 15px; fill: #7f8bb3; }
    .k { fill: #c084fc; } .f { fill: #60a5fa; } .s { fill: #22d3ee; }
    @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    @keyframes pulse  { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes fadeLine { 0%,6% { opacity: 0; } 14%,86% { opacity: 1; } 94%,100% { opacity: 0; } }
    @keyframes scan   { 0% { transform: translateY(-40px); } 100% { transform: translateY(380px); } }
    @keyframes sweep  { 0% { stroke-dashoffset: 1200; } 60%,100% { stroke-dashoffset: 0; } }
    .o1 { animation: float1 7s ease-in-out infinite; }
    .o2 { animation: float2 9s ease-in-out infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .l1 { animation: fadeLine 10s infinite; animation-delay: 0s; }
    .l2 { animation: fadeLine 10s infinite; animation-delay: .6s; }
    .l3 { animation: fadeLine 10s infinite; animation-delay: 1.2s; }
    .l4 { animation: fadeLine 10s infinite; animation-delay: 1.8s; }
    .l5 { animation: fadeLine 10s infinite; animation-delay: 2.4s; }
    .scan { animation: scan 6s linear infinite; }
    .draw { stroke-dasharray: 1200; animation: sweep 5s ease-out infinite alternate; }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g class="o1"><circle cx="170" cy="90" r="190" fill="url(#glowP)"/></g>
  <g class="o2"><circle cx="1040" cy="260" r="210" fill="url(#glowC)"/></g>

  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity="0.18"/>

  <!-- floating code snippets -->
  <g class="mono code">
    <g class="l1"><text x="60" y="70"><tspan class="k">const</tspan> <tspan class="f">app</tspan> = <tspan class="f">express</tspan>();</text></g>
    <g class="l2"><text x="60" y="100"><tspan class="k">app</tspan>.<tspan class="f">use</tspan>(<tspan class="s">"/api"</tspan>, router);</text></g>
    <g class="l3"><text x="60" y="130"><tspan class="k">await</tspan> <tspan class="f">agent</tspan>.<tspan class="f">invoke</tspan>(task);</text></g>
    <g class="l4"><text x="880" y="70"><tspan class="k">export default</tspan> <tspan class="f">Builder</tspan>;</text></g>
    <g class="l5"><text x="880" y="100"><tspan class="k">return</tspan> <tspan class="s">"intelligent apps"</tspan>;</text></g>
  </g>

  <!-- decorative circuit line -->
  <path class="draw" d="M0 300 H220 L260 270 H520 L560 300 H820 L860 270 H1200" fill="none" stroke="url(#bar)" stroke-width="2" opacity="0.7"/>
  <g class="pulse">
    <circle cx="260" cy="270" r="4" fill="#a855f7"/>
    <circle cx="560" cy="300" r="4" fill="#4d8dff"/>
    <circle cx="860" cy="270" r="4" fill="#22d3ee"/>
  </g>

  <!-- title -->
  <text class="sans" x="600" y="168" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#glow)">PREM KUMAR</text>
  <rect x="470" y="190" width="260" height="3" rx="1.5" fill="url(#bar)" class="pulse"/>
  <text class="mono" x="600" y="232" text-anchor="middle" font-size="22" letter-spacing="3" fill="#dbe4ff">FULL STACK DEVELOPER <tspan fill="#a855f7">|</tspan> AGENTIC AI EXPLORER</text>
  <text class="mono" x="600" y="268" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7f8bb3">Building the Future, One Line of Code at a Time<tspan class="cursor" fill="#22d3ee">_</tspan></text>
</svg>
