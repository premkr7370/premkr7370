<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Prem Kumar logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="0.55" stop-color="#4d8dff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace;font-size:34px;font-weight:800}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    .ring{transform-origin:60px 60px;animation:spin 14s linear infinite}
    .core{animation:pulse 3s ease-in-out infinite}
  </style>
  <rect width="120" height="120" rx="28" fill="#070a1a"/>
  <circle class="ring" cx="60" cy="60" r="50" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="40 18 8 18" filter="url(#f)"/>
  <circle class="core" cx="60" cy="60" r="38" fill="none" stroke="#6d5bff" stroke-opacity="0.35" stroke-width="1"/>
  <text class="m" x="60" y="71" text-anchor="middle" fill="url(#g)">&lt;PK/&gt;</text>
</svg>
