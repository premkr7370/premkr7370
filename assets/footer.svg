<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Building the Future, One Line of Code at a Time">
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,monospace; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
  </style>

  <rect width="1200" height="260" fill="url(#bgf)"/>

  <!-- waves: each path is 2400 wide and slides left by 1200 for a seamless loop -->
  <g>
    <path fill="url(#wave3)" d="M0 150 C150 120 300 180 450 150 C600 120 750 180 900 150 C1050 120 1200 180 1350 150 C1500 120 1650 180 1800 150 C1950 120 2100 180 2250 150 C2400 120 2550 180 2700 150 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave2)" d="M0 175 C150 145 300 205 450 175 C600 145 750 205 900 175 C1050 145 1200 205 1350 175 C1500 145 1650 205 1800 175 C1950 145 2100 205 2250 175 C2400 145 2550 205 2700 175 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave1)" d="M0 200 C150 170 300 230 450 200 C600 170 750 230 900 200 C1050 170 1200 230 1350 200 C1500 170 1650 230 1800 200 C1950 170 2100 230 2250 200 C2400 170 2550 230 2700 200 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <text class="mono" x="600" y="92" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="1" fill="url(#txt)">Building the Future, One Line of Code at a Time.</text>
  <text class="mono" x="600" y="124" text-anchor="middle" font-size="15" fill="#9aa6cf">while (alive) { learn(); build(); ship(); }<tspan class="cursor" fill="#22d3ee"> _</tspan></text>
</svg>
